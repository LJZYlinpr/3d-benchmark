metrics:
  expression:
    gene_pcc: Pearson per gene across target bins; median over module genes (core);
      p10 and frac>0.5 (diagnostics)
    rmse: over module genes and target bins on npz X scale
    standardised_rmse: per (gene,bin) error / target std_g, then RMSE (diagnostics)
    zero_variance: N/A
  module:
    module_pcc: Pearson between predicted and GT module maps across target bins
    ms_ssim:
      dim: 2D per target section
      window: 7
      scales: 3
      weights_raw:
      - 0.0448
      - 0.2856
      - 0.3001
      weights_normalised:
      - 0.07105471847739889
      - 0.4529738302934179
      - 0.4759714512291831
      range: masked tissue, invalid border windows dropped; geometric mean
  spatial:
    variance_ratio: log2(var(pred module map) / var(GT module map))
    morans_i:
      knn_k: 6
      weights: symmetrised row-normalised kNN
      primary: '|I_pred - I_GT|'
      secondary: Geary's C
  hotspot:
    threshold: per-module p90 of module score on visible reference slices S1/S5
    same_numeric_threshold_for_gt_and_pred: true
    sensitivity_percentiles:
    - 80
    - 90
    - 95
    threshold_free: average precision (AP) and trapezoidal PR-AUC
    no_positive_rule: recall N/A if GT has no positives; precision N/A if pred has
      no positives; AP/PR-AUC N/A if GT has no positives
  boundary:
    smoothing_sigma_bins: 1.0
    gradient: np.gradient magnitude of Gaussian-smoothed module map
    threshold: per-module p90 of reference S1/S5 gradient (same numeric threshold
      for GT and pred)
    outer_contour: erode tissue mask by 2 bins, then drop components < 2 bins
    tolerance_bins:
    - 0
    - 1
    primary_core: delta=0; delta=1 in metrics_spatial_pr.csv
    f1: 2PR/(P+R) (diagnostics)
    object_level: component counts and GT->pred centroid distance
core_metrics:
- gene_pcc_median
- rmse
- module_pcc
- ms_ssim
- var_ratio_log2
- abs_delta_moran_i
- hotspot_recall
- hotspot_precision
- boundary_recall_d0
- boundary_precision_d0
diagnostics:
- mean_ratio
- zero_fraction
- gene_pcc_p10
- gene_pcc_frac_gt_0.5
- hotspot_AP
- hotspot_PR_AUC
- boundary_F1
- coverage
- no_positive
- split_half_GT_reliability
- paired_bootstrap_by_slice
- runtime
- GPU/RAM
aggregation:
  per_slice: all spatial metrics computed per target section
  pooled: expression metrics over all target bins; MS-SSIM/Moran mean over sections;
    hotspot/boundary micro-summed over sections
  module_summary: mean/median across the 7 combos in metrics_module.csv
  no_composite_score: true
perturbation:
  input: held-out GT module maps only (no predictions, no retraining)
  conditions:
    identity: []
    blur_sigma_bins:
    - 1
    - 2
    - 3
    add_hotspot_radius_bins:
    - 2
    - 3
    add_boundary_band:
    - 1
    shift_bins:
    - 1
    - 2
    correlated_noise_std_factor:
    - 0.5
    - 1.0
    - 2.0
    merge_components_footprint_bins:
    - 2
    split_components_footprint_bins:
    - 2
  correlated_noise: gaussian_filter(white noise, sigma=1.5 bins), unit variance, scaled
    to factor*std(GT)
  merge_split: morphological closing/opening of the p90 hotspot mask; map values inside
    changed regions set above/below threshold
leakage_guards:
  target_expression_never_used_in:
  - module gene lists
  - z-score mean/std
  - hotspot threshold
  - boundary threshold
  - MS-SSIM constants
  - any calibration
  audit: target X equals observed_50um rows for the held-out slices (verified); reference
    stats recomputed from S1/S5 equals stored
  predictions_used_as_is: true
statistics:
  slices: 5
  combos_reuse_slices: true
  independent_replicates: false
  bootstrap: 2000 resamples over 5 slice ids, paired by slice, module PCC
  multiple_comparison: none; descriptive per-combo/module effects only
runtime:
  started_utc: '2026-10-22T10:04:56Z'
